ImaginedNT VirtFS MapTable: v1
Label: ImaginedNT Virtual Root FS
Serial: AAAA-BBBB
MaximumSpace: 10240
Readonly: true
Inherit: true
Default: -read,-write,+enum,-execute,-delete
HostRoot: C:\
Initials:
  -<not_allow>: -read,-enum,-write,-execute,-delete
FS:
  '*@Windows':
    '*@<self>': +read,+enum,-write,-execute,-delete,-exclude
    '*@system32':
      '*@<self>': +read,+enum
      '*@*.exe': +execute
      '*@*.com': +execute
      '*@<left>': +read,+enum
    '*@*.exe': +execute
    '*@explorer.exe': -execute
    '*@**\*.dll': +execute,+enum
    '*@<left>': +read,+enum
  '*@<left>': +exclude
